name: Feature request
description: An idea that would make hYYa Prayer Pal more useful
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the idea and the problem it solves for you.
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes:
      label: Device
      options: [iPhone, iPad, Apple Watch, Android phone or tablet, Wear OS watch, All]
