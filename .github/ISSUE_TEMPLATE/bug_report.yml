name: Bug report
description: Something in hYYa Prayer Pal isn't working right
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Issues are public, so please don't post personal details or screenshots that show them.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown on the app's page in the App Store or Google Play
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes:
      label: Device
      options: [iPhone, iPad, Apple Watch, Android phone or tablet, Wear OS watch]
    validations: { required: true }
  - type: input
    id: area
    attributes:
      label: Which part of the app?
      description: e.g. prayer times, Qibla, Quran, widgets, alerts
  - type: input
    id: city
    attributes:
      label: City or country (only if it is about prayer times or the Qibla)
      description: A city name is enough; please don't share an exact address
